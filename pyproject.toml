[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-channel-dataset-pipeline"
version = "0.1.0"
description = "API-driven synthetic dataset generation and blind scoring for cross-channel social-engineering research"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.101.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
crosschannel = "crosschannel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
